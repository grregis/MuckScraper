# muckscraperHeadlinesGoogleNEW/docker-compose.yml
services:
  postgres:
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.8
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-muckscraper-dev-key}
      # Meilisearch sends anonymous usage data to its makers by default.
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./meili_data:/meili_data
    restart: unless-stopped

  # Holds the Docker socket so the admin app never has to -- exposes only
  # container-list/restart over an internal-only HTTP API. See
  # docker_restart_proxy/app.py for exactly what's reachable.
  docker-restart-proxy:
    build:
      context: ./docker_restart_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: news_fetcher/Dockerfile
    depends_on:
      - postgres
      - meilisearch
    command: sh -c "sleep 15 && python -m news_fetcher.scheduler"
    environment:
      FLASK_APP: aggregator.app
      SECRET_KEY: ${SECRET_KEY}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_REDIRECT_URI: "${OIDC_REDIRECT_URI:-}"
      OIDC_PROVIDER_NAME: "${OIDC_PROVIDER_NAME:-OpenID Connect}"
      OIDC_SCOPES: "${OIDC_SCOPES:-openid profile email groups}"
      OIDC_GROUPS_CLAIM: "${OIDC_GROUPS_CLAIM:-groups}"
      OIDC_ALLOWED_GROUPS: "${OIDC_ALLOWED_GROUPS:-[]}"
      OIDC_ROLE_MAPPING: "${OIDC_ROLE_MAPPING:-}"
      OIDC_CREATE_USERS: "${OIDC_CREATE_USERS:-false}"
      OIDC_ALLOW_PASSWORD_LOGIN: "${OIDC_ALLOW_PASSWORD_LOGIN:-true}"
      OIDC_AUTO_LOGIN: "${OIDC_AUTO_LOGIN:-false}"
      OIDC_SESSION_LIFETIME_SECONDS: "${OIDC_SESSION_LIFETIME_SECONDS:-3600}"
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_FALLBACK_HOST: ${OLLAMA_FALLBACK_HOST:-}
      OLLAMA_PRIMARY_RECHECK_SECONDS: ${OLLAMA_PRIMARY_RECHECK_SECONDS:-60}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-}
      OLLAMA_THINK: ${OLLAMA_THINK:-}
      ARTICLE_CONTENT_LIMIT: ${ARTICLE_CONTENT_LIMIT:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      OLLAMA_MAC: ${OLLAMA_MAC:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_FETCH_REPORT_WEBHOOK_URL: ${N8N_FETCH_REPORT_WEBHOOK_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      MEILI_URL: ${MEILI_URL:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-muckscraper-dev-key}
    restart: unless-stopped
    volumes:
      - .:/app

  app:
    build: .
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-5000}:5000"
    depends_on:
      - postgres
      - meilisearch
      - docker-restart-proxy
    environment:
      FLASK_APP: aggregator.app
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      SECRET_KEY: ${SECRET_KEY}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-UTC}
      PUBLIC_READ_ACCESS: ${PUBLIC_READ_ACCESS:-false}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      GNEWS_API_KEY: ${GNEWS_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_FALLBACK_HOST: ${OLLAMA_FALLBACK_HOST:-}
      OLLAMA_PRIMARY_RECHECK_SECONDS: ${OLLAMA_PRIMARY_RECHECK_SECONDS:-60}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-}
      OLLAMA_THINK: ${OLLAMA_THINK:-}
      ARTICLE_CONTENT_LIMIT: ${ARTICLE_CONTENT_LIMIT:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
      OLLAMA_MAC: ${OLLAMA_MAC:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_FETCH_REPORT_WEBHOOK_URL: ${N8N_FETCH_REPORT_WEBHOOK_URL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-}
      MEILI_URL: ${MEILI_URL:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-muckscraper-dev-key}
      DOCKER_RESTART_PROXY_URL: http://docker-restart-proxy:5001
    restart: unless-stopped
    volumes:
      - .:/app

  # Optional read-only MCP server for health checks and troubleshooting
  # (docs/MCP.md). Off unless started with `docker compose --profile mcp up -d`.
  # The checkout is mounted read-only and the database connection refuses
  # writes; container logs come from docker-restart-proxy, not the socket.
  mcp:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    depends_on:
      - postgres
      - meilisearch
      - docker-restart-proxy
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8765}:8765"
    environment:
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      OLLAMA_PROBE_LOG: ${MCP_OLLAMA_PROBE_LOG:-}
      MCP_EXPECTED_OLLAMA_CONTEXT: ${MCP_EXPECTED_OLLAMA_CONTEXT:-}
      SECRET_KEY: ${SECRET_KEY}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-UTC}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_FALLBACK_HOST: ${OLLAMA_FALLBACK_HOST:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-}
      OLLAMA_THINK: ${OLLAMA_THINK:-}
      ARTICLE_CONTENT_LIMIT: ${ARTICLE_CONTENT_LIMIT:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      MEILI_URL: ${MEILI_URL:-http://meilisearch:7700}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-muckscraper-dev-key}
      DOCKER_RESTART_PROXY_URL: http://docker-restart-proxy:5001
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_OPTIONAL_LOCKS: "0"
    volumes:
      - .:/app:ro
    restart: unless-stopped

networks:
  default:
    name: app-network
